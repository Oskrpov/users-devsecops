apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-frontend
  namespace: users-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-frontend
  template:
    metadata:
      labels:
        app: users-frontend
    spec:
      containers:
        - name: frontend
          image: oskrpov/users-frontend:60
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: users-frontend
  namespace: users-devsecops
spec:
  type: NodePort
  selector:
    app: users-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080