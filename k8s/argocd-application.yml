apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: users-devsecops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Oskrpov/users-devsecops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: users-devsecops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true