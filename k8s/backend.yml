apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-backend
  namespace: users-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-backend
  template:
    metadata:
      labels:
        app: users-backend
    spec:
      containers:
        - name: backend
          image: oskrpov/users-backend:55
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: users-backend-config
            - secretRef:
                name: users-backend-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: users-backend
  namespace: users-devsecops
spec:
  selector:
    app: users-backend
  ports:
    - port: 3000
      targetPort: 3000