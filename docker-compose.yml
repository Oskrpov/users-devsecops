services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres_dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: users_lab
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: bd1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_app -d users_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: users-backend:v1
    container_name: users_backend
    restart: unless-stopped

    environment:
      PORT: 3000
      APP_VERSION: 1.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_lab
      DB_USER: users_app
      DB_PASSWORD: bd1234
      FRONTEND_ORIGIN: http://localhost:5500

    ports:
      - "3000:3000"

    depends_on:
      - postgres
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: users_frontend
    restart: unless-stopped

    ports:
      - "5500:80"

    depends_on:
      - backend

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_postgres_data:
    external: true