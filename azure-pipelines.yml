trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  # Backend - instalar dependencias
  - script: |
      cd backend
      npm ci
    displayName: Install backend dependencies

  # Backend - tests
  - script: |
      cd backend
      npm test
    displayName: Run backend tests

  # Backend - lint
  - script: |
      cd backend
      npm run lint
    displayName: Run backend lint

  # Backend - build y push
  - task: Docker@2
    displayName: Build and push backend
    inputs:
      command: buildAndPush
      containerRegistry: dockerhub-users-devsecops
      repository: oskrpov/users-backend
      Dockerfile: backend/dockerfile
      tags: |
        $(Build.BuildId)

  # Frontend - build y push
  - task: Docker@2
    displayName: Build and push frontend
    inputs:
      command: buildAndPush
      containerRegistry: dockerhub-users-devsecops
      repository: oskrpov/users-frontend
      Dockerfile: frontend/dockerfile
      tags: |
        $(Build.BuildId)
  - script: |
      sed -i "s/:TAG/:$(Build.BuildId)/g" k8s/backend.yaml
      sed -i "s/:TAG/:$(Build.BuildId)/g" k8s/frontend.yaml

      echo "Backend:"
      grep "image:" k8s/backend.yaml

      echo "Frontend:"
      grep "image:" k8s/frontend.yaml
    displayName: Update Kubernetes image tags